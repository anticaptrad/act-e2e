name: Apps Script smoke

on:
  pull_request:
    paths:
      - '.github/workflows/apps-script-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/config.mjs'
      - 'tests/helpers/http.mjs'
      - 'tests/integration/apps-script.test.mjs'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - '.github/workflows/apps-script-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/config.mjs'
      - 'tests/helpers/http.mjs'
      - 'tests/integration/apps-script.test.mjs'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Apps Script contracts
        run: npm run test:apps-script
