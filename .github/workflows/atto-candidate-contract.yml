name: AttoLang candidate E2E boundary cases
on:
  pull_request:
    paths:
      - 'fixtures/atto/**'
      - 'tests/contracts/atto-candidate-boundaries.test.mjs'
      - 'tests/contracts/atto_candidate_boundaries.rs'
      - '.github/workflows/atto-candidate-contract.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/atto/**'
      - 'tests/contracts/atto-candidate-boundaries.test.mjs'
      - 'tests/contracts/atto_candidate_boundaries.rs'
      - '.github/workflows/atto-candidate-contract.yml'
permissions:
  contents: read
jobs:
  atto-boundary-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Check candidate contract vectors with Rust
        run: |
          rustc --edition=2021 --test tests/contracts/atto_candidate_boundaries.rs -o "$RUNNER_TEMP/atto-e2e-tests"
          "$RUNNER_TEMP/atto-e2e-tests"
